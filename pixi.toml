[workspace]
name = "azo-plugin-learning"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.11"
pyyaml = "*"

[feature.test.dependencies]
pexpect = ">=4.9"
pyyaml = "*"
regex = "*"

[feature.test.pypi-dependencies]
pytest = ">=8"

[feature.test.tasks]
test = "PYTHONPATH=../agent-zoo/src:../agent-utils/src:../tmux-pilot/src:src python -m pytest -q"

[environments]
test = ["test"]

[tool.agent-zoo.plugin]
name = "azo-plugin-learning"
common = []
default = ["src/learning.py"]
rlm = []

[tool.agent-zoo.plugin.config]
files = ["config/learning.yaml"]
